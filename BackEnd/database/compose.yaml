services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: zenchat
      POSTGRES_USER: zenchat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - zenchat_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zenchat -d zenchat"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  zenchat_postgres:

